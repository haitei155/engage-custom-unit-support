[package]
name = "engage_custom_unit_support"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
[workspace]
exclude = ["dependencies/engage-il2cpp-0.1.0-reconstructed", "tools/nro-converter"]
[dependencies]
skyline = "0.6"
horizon-svc = { path = "dependencies/horizon-svc", features = ["svc-impl"] }
unity-nx = { path = "dependencies/unity-nx-0.1.0-local" }
mods = { path = "dependencies/cobalt-mods" }
[lib]
crate-type = ["cdylib"]
[profile.release]
panic = "abort"
lto = "thin"
strip = true
[patch.crates-io]
getrandom = { git = "https://github.com/skyline-rs/getrandom" }

[features]
default = []
diagnostics = []
